name: Build Teacher Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Teacher Pro project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          ls -la project

      - name: Build APK
        run: |
          cd project
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Teacher-Pro-v2.5-Premium.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Pro-v2.5-Premium-APK
          path: Teacher-Pro-v2.5-Premium.apk
