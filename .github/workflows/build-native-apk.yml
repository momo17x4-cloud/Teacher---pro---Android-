name: Build Teacher Pro v3 Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Native Project
        run: |
          mkdir native-app
          unzip -q Teacher_Pro_v3_NATIVE_Project.zip -d native-app
          ls -la native-app

      - name: Build Native APK
        run: |
          gradle -p native-app :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp native-app/app/build/outputs/apk/debug/app-debug.apk Teacher-Pro-v3-Native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Pro-v3-Native-APK
          path: Teacher-Pro-v3-Native.apk
