name: Build Teacher Pro v3 Native APK v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract native project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*v3*NATIVE*.zip" | head -n 1)
          echo "ZIP: $ZIP_FILE"
          test -n "$ZIP_FILE"
          mkdir -p native-app
          unzip -q "$ZIP_FILE" -d native-app
          ls -la native-app

      - name: Build APK
        run: |
          cd native-app
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp native-app/app/build/outputs/apk/debug/app-debug.apk Teacher-Pro-v3-Native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Pro-v3-Native-APK
          path: Teacher-Pro-v3-Native.apk
